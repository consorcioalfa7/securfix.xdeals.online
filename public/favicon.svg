<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#ea6663"/>
  <!-- Chainlink mesh pattern -->
  <g stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal chain links -->
    <ellipse cx="10" cy="10" rx="4.5" ry="3" transform="rotate(-15 10 10)"/>
    <ellipse cx="22" cy="10" rx="4.5" ry="3" transform="rotate(15 22 10)"/>
    <ellipse cx="16" cy="18" rx="4.5" ry="3" transform="rotate(0 16 18)"/>
    <ellipse cx="8" cy="24" rx="4.5" ry="3" transform="rotate(-15 8 24)"/>
    <ellipse cx="24" cy="24" rx="4.5" ry="3" transform="rotate(15 24 24)"/>
  </g>
  <!-- Cross connections -->
  <g stroke="white" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="12" y1="12" x2="14" y2="16"/>
    <line x1="20" y1="12" x2="18" y2="16"/>
    <line x1="10" y1="20" x2="12" y2="22"/>
    <line x1="22" y1="20" x2="20" y2="22"/>
  </g>
</svg>
